services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      OLLAMA_HOST: http://host.docker.internal:11434
    env_file:
      - path: .env
        required: false
    volumes:
      - ./el_eco:/app/el_eco
      - ./static:/app/static
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
